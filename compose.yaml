# 本地开发用：只启动数据库和邮件收件箱，Next.js 在本机用 pnpm dev 运行。
name: lawson-website-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawson}
      POSTGRES_DB: ${POSTGRES_DB:-lawson_website}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lawson} -d ${POSTGRES_DB:-lawson_website}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
